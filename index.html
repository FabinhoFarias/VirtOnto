<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>VirtOnto Spatial Engine - Universe 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #05070f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 255, 204, 0.2);
      padding: 15px 20px;
      border-radius: 10px;
      color: #e0f7fc;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      z-index: 10;
      width: 280px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      letter-spacing: 1.5px;
      color: #00ffcc;
      text-transform: uppercase;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 10px;
      box-shadow: 0 0 8px currentColor;
    }
    #tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(5, 10, 20, 0.9);
      border: 1px solid #00ffcc;
      color: #ffffff;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      font-size: 12px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
      z-index: 20;
    }

    .crud-section {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 255, 204, 0.2);
    }
    .crud-section h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #00ffcc;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #a0c0d0;
      margin-bottom: 2px;
    }
    .form-group input[type="text"], 
    .form-group input[type="number"], 
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      background: #0a0f1e;
      border: 1px solid rgba(0, 255, 204, 0.4);
      color: #00ffcc;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .form-group select option {
      background: #0a0f1e;
      color: #ffffff;
    }
    .form-group select optgroup {
      background: #050a14;
      color: #00ffcc;
      font-weight: bold;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #00ffcc;
    }
    .pos-mode-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 11px;
      color: #a0c0d0;
    }
    .pos-mode-selector label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 6px;
      background: rgba(0, 255, 204, 0.15);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      margin-top: 4px;
    }
    .btn:hover {
      background: rgba(0, 255, 204, 0.4);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }
    .btn-danger {
      border-color: #ff4444;
      color: #ff4444;
      background: rgba(255, 68, 68, 0.15);
    }
    .btn-danger:hover {
      background: rgba(255, 68, 68, 0.4);
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
    }
    .btn-secondary {
      border-color: #ffaa00;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 170, 0, 0.4);
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
    }
    .coord-grid {
      display: flex;
      gap: 4px;
    }
    .coord-grid input {
      width: 33.3%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-panel">
    <h2>VirtOnto Spatial Engine</h2>
    <div class="legend-item"><span class="dot" style="background:#00ffcc; color:#00ffcc;"></span> INDIVÍDUO / INSTÂNCIA</div>
    <div class="legend-item"><span class="dot" style="background:#ffaa00; color:#ffaa00;"></span> CLASSE</div>
    <div class="legend-item"><span class="dot" style="background:#0088ff; color:#0088ff;"></span> PROPRIEDADE / ATRIBUTO</div>

    <!-- PAINEL DE CONTROLE CRUD -->
    <!-- 1. CREATE NODE -->
    <div class="crud-section">
      <h3>Criar Nó (Create)</h3>
      <div class="form-group">
        <label>Nome do Conceito / Classe / Objeto</label>
        <input type="text" id="add-id" placeholder="ex: Pessoa, Carro, myCar">
      </div>
      <div class="form-group">
        <label>Tipo Arquétipo</label>
        <select id="add-type">
          <option value="0">CLASSE</option>
          <option value="1">PROPRIEDADE</option>
          <option value="2" selected>INDIVÍDUO / INSTÂNCIA</option>
        </select>
      </div>

      <!-- SELEÇÃO DE MODO DE POSICIONAMENTO -->
      <div class="form-group">
        <label>Posicionamento Espacial</label>
        <div class="pos-mode-selector">
          <label><input type="radio" name="pos-mode" value="coord" checked> Coordenadas (X,Y,Z)</label>
          <label><input type="radio" name="pos-mode" value="between"> Entre 2 Nós</label>
        </div>
      </div>

      <!-- OPÇÃO A: COORDENADAS MANUAIS -->
      <div id="mode-coord-container" class="form-group">
        <label>Posição (X, Y, Z)</label>
        <div class="coord-grid">
          <input type="number" id="add-x" value="0" step="0.1">
          <input type="number" id="add-y" value="0" step="0.1">
          <input type="number" id="add-z" value="0" step="0.1">
        </div>
      </div>

      <!-- OPÇÃO B: SELECIONAR 2 PONTOS EXISTENTES -->
      <div id="mode-between-container" style="display:none;">
        <div class="form-group">
          <label>Ponto A (Primeiro Nó)</label>
          <select id="pos-node-a">
            <option value="">-- Selecione o Nó A --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ponto B (Segundo Nó)</label>
          <select id="pos-node-b">
            <option value="">-- Selecione o Nó B --</option>
          </select>
        </div>
      </div>

      <button class="btn" id="btn-add-node">Adicionar Nó</button>
    </div>

    <!-- 2. CREATE EDGE -->
    <div class="crud-section">
      <h3>Criar Relação (Create)</h3>
      <div class="form-group">
        <label>Origem (Subject)</label>
        <select id="edge-src">
          <option value="">-- Selecione o Nó --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Destino (Object)</label>
        <select id="edge-tgt">
          <option value="">-- Selecione o Nó --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Relação (Predicate)</label>
        <select id="edge-label-select">
          <optgroup label="Ontologia / OWL / RDF">
            <option value="subClassOf">subClassOf (Subclasse de)</option>
            <option value="type">rdf:type (Instância de)</option>
            <option value="equivalentClass">equivalentClass (Equivalente a)</option>
            <option value="disjointWith">disjointWith (Disjunto de)</option>
            <option value="sameAs">owl:sameAs (Mesmo Indivíduo)</option>
          </optgroup>
          <optgroup label="POO (Programação Orientada a Objetos)">
            <option value="extends">extends (Herança)</option>
            <option value="implements">implements (Interface)</option>
            <option value="hasA">hasA (Composição / Agregação)</option>
            <option value="uses">uses (Dependência)</option>
            <option value="associatesWith">associatesWith (Associação)</option>
          </optgroup>
          <optgroup label="Outro">
            <option value="__CUSTOM__">+ Digitar Outra...</option>
          </optgroup>
        </select>
      </div>
      <div class="form-group" id="custom-label-container" style="display:none;">
        <label>Especifique a Relação</label>
        <input type="text" id="edge-label-custom" placeholder="ex: manages, owns">
      </div>
      <button class="btn" id="btn-add-edge">Conectar Nós</button>
    </div>

    <!-- 3. UPDATE & DELETE NODE -->
    <div class="crud-section" id="selection-panel" style="display:none;">
      <h3 style="color:#ffaa00;">Nó Selecionado</h3>
      <div class="form-group">
        <label>Nome / Conceito</label>
        <input type="text" id="edit-label">
      </div>
      <div class="form-group">
        <label>Novo Tipo</label>
        <select id="edit-type">
          <option value="0">CLASSE</option>
          <option value="1">PROPRIEDADE</option>
          <option value="2">INDIVÍDUO / INSTÂNCIA</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="btn-update-node">Atualizar Nó</button>
      <button class="btn btn-danger" id="btn-delete-node">Deletar Nó</button>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070f, 0.005);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 45);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0x1a2b4c, 2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x00ffcc, 1.5, 100);
    pointLight.position.set(0, 10, 10);
    scene.add(pointLight);

    const TYPE_COLORS = { 0: 0xffaa00, 1: 0x0088ff, 2: 0x00ffcc };

    let graphData = { nodes: [], edges: [] };
    const nodeObjects = [];
    const nodeMap = {};
    const edgeObjects = []; 

    let selectedNodeMesh = null;
    const nodeGeometry = new THREE.SphereGeometry(0.6, 16, 16);

    // PLANO MATEMÁTICO INVISÍVEL EM Z = 0 PARA CAPTURAR COORDENADAS NO ESPAÇO VAZIO
    const mathPlaneZZero = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const planeIntersectionPoint = new THREE.Vector3();

    function cleanId(id) {
      if (id === null || id === undefined) return "";
      return String(id).trim();
    }

    // Controle da interface para alternar modos de posicionamento
    document.querySelectorAll('input[name="pos-mode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const mode = e.target.value;
        const coordContainer = document.getElementById('mode-coord-container');
        const betweenContainer = document.getElementById('mode-between-container');

        if (mode === 'coord') {
          coordContainer.style.display = 'block';
          betweenContainer.style.display = 'none';
        } else {
          coordContainer.style.display = 'none';
          betweenContainer.style.display = 'block';
        }
      });
    });

    // Exibe alternância para entrada customizada de relação
    document.getElementById('edge-label-select').addEventListener('change', (e) => {
      const customContainer = document.getElementById('custom-label-container');
      if (e.target.value === '__CUSTOM__') {
        customContainer.style.display = 'block';
      } else {
        customContainer.style.display = 'none';
      }
    });

    // Facade: Atualiza todos os dropdowns apenas com os rótulos/nomes amigáveis
    function updateNodeDropdowns() {
      const srcSelect = document.getElementById('edge-src');
      const tgtSelect = document.getElementById('edge-tgt');
      const posASelect = document.getElementById('pos-node-a');
      const posBSelect = document.getElementById('pos-node-b');

      if (!srcSelect || !tgtSelect || !posASelect || !posBSelect) return;
      
      const currentSrc = srcSelect.value;
      const currentTgt = tgtSelect.value;
      const currentPosA = posASelect.value;
      const currentPosB = posBSelect.value;

      srcSelect.innerHTML = '<option value="">-- Selecione o Nó --</option>';
      tgtSelect.innerHTML = '<option value="">-- Selecione o Nó --</option>';
      posASelect.innerHTML = '<option value="">-- Selecione o Nó A --</option>';
      posBSelect.innerHTML = '<option value="">-- Selecione o Nó B --</option>';

      const sortedKeys = Object.keys(nodeMap).sort((a, b) => {
        const labelA = (nodeMap[a].userData.label || "").toLowerCase();
        const labelB = (nodeMap[b].userData.label || "").toLowerCase();
        return labelA.localeCompare(labelB);
      });

      sortedKeys.forEach(id => {
        const mesh = nodeMap[id];
        const displayLabel = mesh.userData.label || id;

        const createOpt = () => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = displayLabel;
          return opt;
        };

        srcSelect.appendChild(createOpt());
        tgtSelect.appendChild(createOpt());
        posASelect.appendChild(createOpt());
        posBSelect.appendChild(createOpt());
      });

      srcSelect.value = currentSrc;
      tgtSelect.value = currentTgt;
      posASelect.value = currentPosA;
      posBSelect.value = currentPosB;
    }

    function renderNode(n) {
      const id = cleanId(n.id);
      if (!id) return null;

      if (nodeMap[id]) return nodeMap[id];

      // Mapeamento amigável do Facade
      const displayLabel = n.label || n.name || n.title || id;

      const colorHex = TYPE_COLORS[n.type] !== undefined ? TYPE_COLORS[n.type] : 0xffffff;
      
      const material = new THREE.MeshPhongMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 0.4,
        shininess: 100
      });

      const mesh = new THREE.Mesh(nodeGeometry, material);
      mesh.position.set(n.x || 0, n.y || 0, n.z || 0);
      
      mesh.userData = {
        id: id,
        label: displayLabel,
        type: n.type !== undefined ? n.type : 2,
        x: n.x || 0,
        y: n.y || 0,
        z: n.z || 0
      };

      scene.add(mesh);
      nodeObjects.push(mesh);
      nodeMap[id] = mesh;

      updateNodeDropdowns();
      return mesh;
    }

    function renderEdge(e) {
      const srcId = cleanId(e.source || e.src || e.sourceId);
      const tgtId = cleanId(e.target || e.tgt || e.targetId);
      const relationLabel = e.label || e.relation || "subClassOf";

      if (!srcId || !tgtId) return false;

      if (!nodeMap[srcId]) {
        renderNode({ id: srcId, label: srcId, type: 2, x: 0, y: 0, z: 0 });
      }
      if (!nodeMap[tgtId]) {
        renderNode({ id: tgtId, label: tgtId, type: 2, x: 5, y: 0, z: 0 });
      }

      const srcNode = nodeMap[srcId];
      const tgtNode = nodeMap[tgtId];
    
      const origin = srcNode.position.clone();
      const destination = tgtNode.position.clone();
    
      const points = [origin, destination];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const lineMat = new THREE.LineBasicMaterial({
        color: 0x0088ff,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending
      });
      const line = new THREE.Line(lineGeo, lineMat);
      scene.add(line);
    
      const direction = new THREE.Vector3().subVectors(destination, origin);
      const length = direction.length();
      direction.normalize();
    
      const arrowPosition = origin.clone().add(direction.clone().multiplyScalar(length * 0.8));
      
      const arrowHelper = new THREE.ArrowHelper(
        direction, 
        arrowPosition, 
        1.5,
        0x00ffcc,
        0.8,
        0.5
      );
    
      scene.add(arrowHelper);

      const edgeObj = { data: e, line: line, arrow: arrowHelper, sourceId: srcId, targetId: tgtId, label: relationLabel };
      edgeObjects.push(edgeObj);
      return true;
    }

    fetch('/renderable.json')
      .then(res => res.json())
      .then(graph => {
        graphData = graph;
        if (graph.nodes && Array.isArray(graph.nodes)) {
          graph.nodes.forEach(n => renderNode(n));
        }
        if (graph.edges && Array.isArray(graph.edges)) {
          graph.edges.forEach(e => renderEdge(e));
        }
        updateNodeDropdowns();
      })
      .catch(err => {
        console.log("Aguardando inserção manual de nós.");
        updateNodeDropdowns();
      });

    // CRIAÇÃO DO NÓ (SUPORTA COORDENADAS OU INTERPOLAÇÃO ENTRE 2 PONTOS)
    document.getElementById('btn-add-node').addEventListener('click', () => {
      const nameInput = document.getElementById('add-id').value.trim();
      if (!nameInput) {
        alert("Por favor, digite o nome do nó!");
        return;
      }

      const id = `Node_${Date.now()}`;
      const type = parseInt(document.getElementById('add-type').value);
      const posMode = document.querySelector('input[name="pos-mode"]:checked').value;

      let x = 0, y = 0, z = 0;

      if (posMode === 'coord') {
        x = parseFloat(document.getElementById('add-x').value) || 0;
        y = parseFloat(document.getElementById('add-y').value) || 0;
        z = parseFloat(document.getElementById('add-z').value) || 0;
      } else {
        const nodeAId = document.getElementById('pos-node-a').value;
        const nodeBId = document.getElementById('pos-node-b').value;

        if (!nodeAId || !nodeBId) {
          alert("Selecione dois nós válidos para posicionar o novo nó entre eles!");
          return;
        }

        if (nodeAId === nodeBId) {
          alert("Escolha dois nós diferentes para calcular a posição média.");
          return;
        }

        const meshA = nodeMap[nodeAId];
        const meshB = nodeMap[nodeBId];

        // Cálculo da posição central via .lerp()
        const midPos = meshA.position.clone().lerp(meshB.position, 0.5);
        x = midPos.x;
        y = midPos.y;
        z = midPos.z;
      }

      const newNode = { id: id, label: nameInput, type: type, x: x, y: y, z: z };
      renderNode(newNode);
      document.getElementById('add-id').value = '';
    });

    document.getElementById('btn-add-edge').addEventListener('click', () => {
      const src = cleanId(document.getElementById('edge-src').value);
      const tgt = cleanId(document.getElementById('edge-tgt').value);
      
      const selectVal = document.getElementById('edge-label-select').value;
      let label = selectVal;

      if (selectVal === '__CUSTOM__') {
        label = document.getElementById('edge-label-custom').value.trim();
      }

      if (!src || !tgt) {
        alert("Selecione os dois nós para conectar!");
        return;
      }

      if (src === tgt) {
        alert("Escolha dois nós diferentes.");
        return;
      }

      if (!label) {
        alert("Selecione ou digite o tipo de relação POO/Ontológica.");
        return;
      }

      renderEdge({ source: src, target: tgt, label: label });
      document.getElementById('edge-label-custom').value = '';
    });

    document.getElementById('btn-update-node').addEventListener('click', () => {
      if (!selectedNodeMesh) return;

      const newLabel = document.getElementById('edit-label').value.trim();
      const newType = parseInt(document.getElementById('edit-type').value);

      selectedNodeMesh.userData.label = newLabel;
      selectedNodeMesh.userData.type = newType;

      const colorHex = TYPE_COLORS[newType] !== undefined ? TYPE_COLORS[newType] : 0xffffff;
      selectedNodeMesh.material.color.setHex(colorHex);
      selectedNodeMesh.material.emissive.setHex(colorHex);

      updateNodeDropdowns();
      alert(`Nó '${newLabel}' atualizado!`);
    });

    document.getElementById('btn-delete-node').addEventListener('click', () => {
      if (!selectedNodeMesh) return;

      const idToDelete = cleanId(selectedNodeMesh.userData.id);

      scene.remove(selectedNodeMesh);

      const index = nodeObjects.indexOf(selectedNodeMesh);
      if (index > -1) nodeObjects.splice(index, 1);
      
      delete nodeMap[idToDelete];

      for (let i = edgeObjects.length - 1; i >= 0; i--) {
        const edgeObj = edgeObjects[i];
        if (edgeObj.sourceId === idToDelete || edgeObj.targetId === idToDelete) {
          scene.remove(edgeObj.line);
          scene.remove(edgeObj.arrow);
          edgeObjects.splice(i, 1);
        }
      }

      updateNodeDropdowns();
      document.getElementById('selection-panel').style.display = 'none';
      selectedNodeMesh = null;
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeObjects);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        tooltip.style.display = 'block';
        tooltip.style.left = e.clientX + 12 + 'px';
        tooltip.style.top = e.clientY + 12 + 'px';
        tooltip.innerHTML = `<strong>${data.label}</strong>`;
      } else {
        tooltip.style.display = 'none';
      }
    });

    // CONTROLE DE INTERAÇÃO VIA POINTERDOWN/POINTERUP (EVITA CONFLITO COM ORBITCONTROLS)
    let pointerDownPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      // Ignora interações iniciadas dentro do painel lateral ou nos controlos HTML
      if (e.target.closest('#ui-panel') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;

      // Se moveu mais de 3px entre o clique e a soltura, significa que o utilizador estava a arrastar/rodar a câmara
      const deltaX = Math.abs(e.clientX - pointerDownPos.x);
      const deltaY = Math.abs(e.clientY - pointerDownPos.y);
      if (deltaX > 3 || deltaY > 3) return;

      // Recalcula as coordenadas normalizadas
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeObjects);

      if (intersects.length > 0) {
        // CENÁRIO A: Clicou num Nó Existente
        selectedNodeMesh = intersects[0].object;
        const data = selectedNodeMesh.userData;

        document.getElementById('selection-panel').style.display = 'block';
        document.getElementById('edit-label').value = data.label;
        document.getElementById('edit-type').value = data.type !== undefined ? data.type : 0;

        // Atualiza os campos de criação com as coordenadas reais do nó clicado
        document.getElementById('add-x').value = selectedNodeMesh.position.x.toFixed(2);
        document.getElementById('add-y').value = selectedNodeMesh.position.y.toFixed(2);
        document.getElementById('add-z').value = selectedNodeMesh.position.z.toFixed(2);
      } else {
        // CENÁRIO B: Clicou no Espaço Vazio — calcula a interseção com o plano Z = 0
        const hit = raycaster.ray.intersectPlane(mathPlaneZZero, planeIntersectionPoint);

        if (hit) {
          // 1. Atualiza automaticamente os valores nos campos de texto (inputs)
          document.getElementById('add-x').value = planeIntersectionPoint.x.toFixed(2);
          document.getElementById('add-y').value = planeIntersectionPoint.y.toFixed(2);
          document.getElementById('add-z').value = planeIntersectionPoint.z.toFixed(2);

          // 2. Garante que a opção de coordenadas está visível
          const coordRadio = document.querySelector('input[name="pos-mode"][value="coord"]');
          if (coordRadio) {
            coordRadio.checked = true;
            document.getElementById('mode-coord-container').style.display = 'block';
            document.getElementById('mode-between-container').style.display = 'none';
          }
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
