<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Grafos 3D - Layouts Automáticos</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #050505;
      color: #ffffff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* Interface Glassmorphism */
    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(20, 20, 35, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 16px;
      width: 280px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 10;
    }

    h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #00ffcc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .layout-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      background: rgba(0, 255, 204, 0.15);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #00ffcc;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    button.active {
      background: #00ffcc;
      color: #111;
    }

    /* Legend */
    .legend {
      margin-top: 15px;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    #tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      pointer-events: none;
      display: none;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
  
  <!-- Three.js e OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="tooltip"></div>

  <div class="ui-panel">
    <h3>Layouts de Grafo</h3>
    <div class="layout-btn-group">
      <button onclick="applyLayout('force')">Força (3D)</button>
      <button onclick="applyLayout('sphere')">Esférico</button>
      <button onclick="applyLayout('grid')">Grade 3D</button>

    </div>

    <div class="legend">
      <strong>Legenda de Tipos:</strong>
      <div class="legend-item"><span class="dot" style="background:#ffaa00;"></span> Classe</div>
      <div class="legend-item"><span class="dot" style="background:#0088ff;"></span> Propriedade</div>
      <div class="legend-item"><span class="dot" style="background:#00ffcc;"></span> Instância</div>
    </div>
  </div>

  <script>
    // --- Configuração Básica da Cena 3D ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 20, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.8);
    pointLight.position.set(50, 50, 50);
    scene.add(pointLight);

    const gridHelper = new THREE.GridHelper(60, 60, 0x333333, 0x111111);
    scene.add(gridHelper);

    // --- Estrutura de Dados do Grafo ---
    const nodes = [
      { id: 1, name: "Pessoa", type: "class", color: 0xffaa00, pos: new THREE.Vector3() },
      { id: 2, name: "Estudante", type: "class", color: 0xffaa00, pos: new THREE.Vector3() },
      { id: 3, name: "Professor", type: "class", color: 0xffaa00, pos: new THREE.Vector3() },
      { id: 4, name: "nome", type: "property", color: 0x0088ff, pos: new THREE.Vector3() },
      { id: 5, name: "idade", type: "property", color: 0x0088ff, pos: new THREE.Vector3() },
      { id: 6, name: "João", type: "instance", color: 0x00ffcc, pos: new THREE.Vector3() },
      { id: 7, name: "Maria", type: "instance", color: 0x00ffcc, pos: new THREE.Vector3() },
      { id: 8, name: "Curso", type: "class", color: 0xffaa00, pos: new THREE.Vector3() }
    ];

    const links = [
      { source: 2, target: 1 }, // Estudante subClassOf Pessoa
      { source: 3, target: 1 }, // Professor subClassOf Pessoa
      { source: 1, target: 4 }, // Pessoa hasProperty nome
      { source: 1, target: 5 }, // Pessoa hasProperty idade
      { source: 6, target: 2 }, // João type Estudante
      { source: 7, target: 3 }, // Maria type Professor
      { source: 2, target: 8 }  // Estudante matriculado Curso
    ];

    const nodeObjects = [];
    const linkObjects = [];
    let isPhysicsActive = false;

    // --- Geometrias e Materiais ---
    const sphereGeo = new THREE.SphereGeometry(1, 32, 32);

    // Criação Visual dos Nós e Conexões
    nodes.forEach(node => {
      const mat = new THREE.MeshPhongMaterial({ color: node.color, shininess: 100 });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      mesh.userData = node;
      scene.add(mesh);
      nodeObjects.push(mesh);
    });

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.6 });

    links.forEach(link => {
      const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const line = new THREE.Line(geometry, lineMaterial);
      line.userData = link;
      scene.add(line);
      linkObjects.push(line);
    });

    // --- Algoritmos de Layout ---

    function applyLayout(type) {
      isPhysicsActive = false; // Interrompe física se trocar para layout estático

      switch (type) {
        case 'sphere':
          // Distribuição de Fibonacci sobre uma Esfera 3D
          const phi = Math.PI * (3 - Math.sqrt(5)); // Ângulo de ouro
          const radius = 15;
          nodes.forEach((node, i) => {
            const y = 1 - (i / (nodes.length - 1)) * 2;
            const r = Math.sqrt(1 - y * y) * radius;
            const theta = phi * i;

            const targetPos = new THREE.Vector3(
              Math.cos(theta) * r,
              y * radius,
              Math.sin(theta) * r
            );
            animateToPosition(nodeObjects[i], targetPos);
          });
          break;

        case 'grid':
          // Layout em Grade Tridimensional 3D
          const side = Math.ceil(Math.cbrt(nodes.length));
          const spacing = 8;
          const offset = ((side - 1) * spacing) / 2;

          nodes.forEach((node, i) => {
            const x = (i % side) * spacing - offset;
            const y = (Math.floor(i / side) % side) * spacing - offset;
            const z = Math.floor(i / (side * side)) * spacing - offset;

            animateToPosition(nodeObjects[i], new THREE.Vector3(x, y, z));
          });
          break;

        case 'force':
          // Ativa a Simulação de Força 3D contínua
          // Adiciona pequenas variações aleatórias iniciais para quebrar simetrias
          nodeObjects.forEach(obj => {
            obj.position.add(new THREE.Vector3(
              (Math.random() - 0.5) * 2,
              (Math.random() - 0.5) * 2,
              (Math.random() - 0.5) * 2
            ));
          });
          isPhysicsActive = true;
          break;
      }
    }

    // Animação suave para layouts estáticos (Interpolação/Lerp)
    function animateToPosition(mesh, targetPos) {
      const startPos = mesh.position.clone();
      let startTime = null;
      const duration = 1000; // 1 segundo

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        
        // Função de Easing: EaseInOutCubic
        const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        mesh.position.lerpVectors(startPos, targetPos, ease);

        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    // --- Motor de Física 3D (Force-Directed Graph) ---
    function updatePhysics() {
      if (!isPhysicsActive) return;

      const repulsionStrength = 120;
      const springLength = 8;
      const springStrength = 0.05;
      const damping = 0.85;

      // Reset de forças acumuladas
      nodes.forEach(node => {
        if (!node.velocity) node.velocity = new THREE.Vector3();
        node.force = new THREE.Vector3();
      });

      // 1. Repulsão de Coulomb entre todos os nós (N^2)
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const posA = nodeObjects[i].position;
          const posB = nodeObjects[j].position;

          const dir = new THREE.Vector3().subVectors(posA, posB);
          let dist = dir.length();
          if (dist === 0) {
            dir.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
            dist = 0.1;
          }

          dir.normalize();
          const forceMagnitude = repulsionStrength / (dist * dist);

          nodes[i].force.addScaledVector(dir, forceMagnitude);
          nodes[j].force.addScaledVector(dir, -forceMagnitude);
        }
      }

      // 2. Atração de Mola (Lei de Hooke) entre nós conectados
      links.forEach(link => {
        const sourceIdx = nodes.findIndex(n => n.id === link.source);
        const targetIdx = nodes.findIndex(n => n.id === link.target);

        if (sourceIdx !== -1 && targetIdx !== -1) {
          const posA = nodeObjects[sourceIdx].position;
          const posB = nodeObjects[targetIdx].position;

          const dir = new THREE.Vector3().subVectors(posB, posA);
          const dist = dir.length();
          dir.normalize();

          const displacement = dist - springLength;
          const forceMagnitude = displacement * springStrength;

          nodes[sourceIdx].force.addScaledVector(dir, forceMagnitude);
          nodes[targetIdx].force.addScaledVector(dir, -forceMagnitude);
        }
      });

      // 3. Aplicação de Velocidade e Amortecimento
      nodeObjects.forEach((obj, i) => {
        const node = nodes[i];
        node.velocity.add(node.force.multiplyScalar(0.016)); // dt delta-time
        node.velocity.multiplyScalar(damping);
        obj.position.add(node.velocity);
      });
    }

    // --- Atualizar Posição das Linhas de Relação ---
    function updateLinks() {
      linkObjects.forEach(line => {
        const link = line.userData;
        const sourceNode = nodeObjects.find(obj => obj.userData.id === link.source);
        const targetNode = nodeObjects.find(obj => obj.userData.id === link.target);

        if (sourceNode && targetNode) {
          const positions = line.geometry.attributes.position.array;
          positions[0] = sourceNode.position.x;
          positions[1] = sourceNode.position.y;
          positions[2] = sourceNode.position.z;
          positions[3] = targetNode.position.x;
          positions[4] = targetNode.position.y;
          positions[5] = targetNode.position.z;
          line.geometry.attributes.position.needsUpdate = true;
        }
      });
    }

    // --- Loop de Animação ---
    function animate() {
      requestAnimationFrame(animate);

      updatePhysics();
      updateLinks();

      controls.update();
      renderer.render(scene, camera);
    }

    // Inicialização
    applyLayout('force');
    animate();

    // Redimensionamento de janela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
